name: Deploy Supabase backend

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      CRAWL_LIVE: ${{ vars.CRAWL_LIVE || 'false' }}
      CRAWLER_SOURCE_ASTREE_ENABLED: ${{ vars.CRAWLER_SOURCE_ASTREE_ENABLED || 'false' }}
      CRAWLER_SOURCE_TTADIVISION_ENABLED: ${{ vars.CRAWLER_SOURCE_TTADIVISION_ENABLED || 'true' }}
      CRAWLER_SOURCE_AIRPING_ENABLED: ${{ vars.CRAWLER_SOURCE_AIRPING_ENABLED || 'true' }}
      CRAWLER_SOURCE_OKPINGPONG_ENABLED: ${{ vars.CRAWLER_SOURCE_OKPINGPONG_ENABLED || 'true' }}
      CRAWLER_SOURCE_MYTT_ENABLED: ${{ vars.CRAWLER_SOURCE_MYTT_ENABLED || 'true' }}
      CRAWLER_SOURCE_SUPERSTAR_ENABLED: ${{ vars.CRAWLER_SOURCE_SUPERSTAR_ENABLED || 'true' }}
      CRAWLER_SOURCE_YONGINTT_ENABLED: ${{ vars.CRAWLER_SOURCE_YONGINTT_ENABLED || 'true' }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      CRAWLER_USER_AGENT: ${{ vars.CRAWLER_USER_AGENT || 'BUSU/0.1' }}
      CRAWLER_SOURCE_MIN_INTERVAL_MS: ${{ vars.CRAWLER_SOURCE_MIN_INTERVAL_MS || '2000' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - name: Validate deployment configuration
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"
      - name: Prepare Edge Function shared modules
        run: pnpm edge:sync
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Preview database migrations
        run: supabase db push --linked --dry-run
      - name: Apply database migrations
        run: supabase db push --linked
      - name: Configure Edge Function runtime
        run: >-
          supabase secrets set
          --project-ref "$SUPABASE_PROJECT_ID"
          CRAWL_LIVE="$CRAWL_LIVE"
          CRAWLER_SOURCE_ASTREE_ENABLED="$CRAWLER_SOURCE_ASTREE_ENABLED"
          CRAWLER_SOURCE_TTADIVISION_ENABLED="$CRAWLER_SOURCE_TTADIVISION_ENABLED"
          CRAWLER_SOURCE_AIRPING_ENABLED="$CRAWLER_SOURCE_AIRPING_ENABLED"
          CRAWLER_SOURCE_OKPINGPONG_ENABLED="$CRAWLER_SOURCE_OKPINGPONG_ENABLED"
          CRAWLER_SOURCE_MYTT_ENABLED="$CRAWLER_SOURCE_MYTT_ENABLED"
          CRAWLER_SOURCE_SUPERSTAR_ENABLED="$CRAWLER_SOURCE_SUPERSTAR_ENABLED"
          CRAWLER_SOURCE_YONGINTT_ENABLED="$CRAWLER_SOURCE_YONGINTT_ENABLED"
          CRAWLER_USER_AGENT="$CRAWLER_USER_AGENT"
          CRAWLER_SOURCE_MIN_INTERVAL_MS="$CRAWLER_SOURCE_MIN_INTERVAL_MS"
      - name: Configure Kakao REST API key
        if: env.KAKAO_REST_API_KEY != ''
        run: >-
          supabase secrets set
          --project-ref "$SUPABASE_PROJECT_ID"
          KAKAO_REST_API_KEY="$KAKAO_REST_API_KEY"
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
