name: Deploy Supabase backend

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      CRAWL_LIVE: ${{ vars.CRAWL_LIVE || 'false' }}
      CRAWLER_SOURCE_ASTREE_ENABLED: ${{ vars.CRAWLER_SOURCE_ASTREE_ENABLED || 'false' }}
      CRAWLER_SOURCE_NEWTTPLAY_ENABLED: ${{ vars.CRAWLER_SOURCE_NEWTTPLAY_ENABLED || 'false' }}
      CRAWLER_SOURCE_TTADIVISION_ENABLED: ${{ vars.CRAWLER_SOURCE_TTADIVISION_ENABLED || 'true' }}
      CRAWLER_SOURCE_AIRPING_ENABLED: ${{ vars.CRAWLER_SOURCE_AIRPING_ENABLED || 'true' }}
      CRAWLER_SOURCE_OKPINGPONG_ENABLED: ${{ vars.CRAWLER_SOURCE_OKPINGPONG_ENABLED || 'true' }}
      CRAWLER_SOURCE_MYTT_ENABLED: ${{ vars.CRAWLER_SOURCE_MYTT_ENABLED || 'true' }}
      CRAWLER_SOURCE_SUPERSTAR_ENABLED: ${{ vars.CRAWLER_SOURCE_SUPERSTAR_ENABLED || 'true' }}
      CRAWLER_SOURCE_YONGINTT_ENABLED: ${{ vars.CRAWLER_SOURCE_YONGINTT_ENABLED || 'true' }}
      CRAWLER_SOURCE_IPING_ENABLED: ${{ vars.CRAWLER_SOURCE_IPING_ENABLED || 'false' }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      IPING_USERNAME: ${{ secrets.IPING_USERNAME }}
      IPING_PASSWORD: ${{ secrets.IPING_PASSWORD }}
      GITHUB_ISSUES_REPOSITORY: ${{ vars.GITHUB_ISSUES_REPOSITORY || 'iamdenny/pingpong-busu' }}
      FEEDBACK_ALLOWED_ORIGINS: ${{ vars.FEEDBACK_ALLOWED_ORIGINS || 'https://busu.iamdenny.com' }}
      CRAWLER_SOURCE_MIN_INTERVAL_MS: ${{ vars.CRAWLER_SOURCE_MIN_INTERVAL_MS || '2000' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - name: Read package version
        id: version
        run: node --import tsx scripts/release-version.ts output >> "$GITHUB_OUTPUT"
      - name: Validate deployment configuration
        env:
          FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$FEEDBACK_GITHUB_TOKEN"
      - name: Prepare Edge Function shared modules
        run: pnpm edge:sync
      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Preview database migrations
        run: supabase db push --linked --dry-run
      - name: Apply database migrations
        run: supabase db push --linked
      - name: Configure Edge Function runtime
        run: >-
          supabase secrets set
          --project-ref "$SUPABASE_PROJECT_ID"
          CRAWL_LIVE="$CRAWL_LIVE"
          CRAWLER_SOURCE_ASTREE_ENABLED="$CRAWLER_SOURCE_ASTREE_ENABLED"
          CRAWLER_SOURCE_NEWTTPLAY_ENABLED="$CRAWLER_SOURCE_NEWTTPLAY_ENABLED"
          CRAWLER_SOURCE_TTADIVISION_ENABLED="$CRAWLER_SOURCE_TTADIVISION_ENABLED"
          CRAWLER_SOURCE_AIRPING_ENABLED="$CRAWLER_SOURCE_AIRPING_ENABLED"
          CRAWLER_SOURCE_OKPINGPONG_ENABLED="$CRAWLER_SOURCE_OKPINGPONG_ENABLED"
          CRAWLER_SOURCE_MYTT_ENABLED="$CRAWLER_SOURCE_MYTT_ENABLED"
          CRAWLER_SOURCE_SUPERSTAR_ENABLED="$CRAWLER_SOURCE_SUPERSTAR_ENABLED"
          CRAWLER_SOURCE_YONGINTT_ENABLED="$CRAWLER_SOURCE_YONGINTT_ENABLED"
          CRAWLER_SOURCE_IPING_ENABLED="$CRAWLER_SOURCE_IPING_ENABLED"
          CRAWLER_USER_AGENT="BUSU/${{ steps.version.outputs.version }}"
          CRAWLER_SOURCE_MIN_INTERVAL_MS="$CRAWLER_SOURCE_MIN_INTERVAL_MS"
          GITHUB_ISSUES_REPOSITORY="$GITHUB_ISSUES_REPOSITORY"
          FEEDBACK_ALLOWED_ORIGINS="$FEEDBACK_ALLOWED_ORIGINS"
      - name: Configure GitHub Issues token
        env:
          FEEDBACK_GITHUB_TOKEN: ${{ secrets.FEEDBACK_GITHUB_TOKEN }}
        run: >-
          supabase secrets set
          --project-ref "$SUPABASE_PROJECT_ID"
          GITHUB_ISSUES_TOKEN="$FEEDBACK_GITHUB_TOKEN"
      - name: Configure Kakao REST API key
        if: env.KAKAO_REST_API_KEY != ''
        run: >-
          supabase secrets set
          --project-ref "$SUPABASE_PROJECT_ID"
          KAKAO_REST_API_KEY="$KAKAO_REST_API_KEY"
      - name: Validate iPing runtime credentials
        if: env.CRAWLER_SOURCE_IPING_ENABLED == 'true'
        run: |
          test -n "$IPING_USERNAME"
          test -n "$IPING_PASSWORD"
      - name: Configure iPing runtime credentials
        if: env.IPING_USERNAME != '' && env.IPING_PASSWORD != ''
        run: >-
          supabase secrets set
          --project-ref "$SUPABASE_PROJECT_ID"
          IPING_USERNAME="$IPING_USERNAME"
          IPING_PASSWORD="$IPING_PASSWORD"
      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
