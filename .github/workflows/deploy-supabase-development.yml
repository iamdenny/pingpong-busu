name: Deploy Supabase development backend

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type deploy-development to confirm the target
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-development
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'deploy-development'
    runs-on: ubuntu-latest
    environment: development
    env:
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_PRODUCTION_PROJECT_ID: ${{ vars.SUPABASE_PRODUCTION_PROJECT_ID }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.114.0
      - run: pnpm install --frozen-lockfile
      - name: Read package version
        id: version
        run: node --import tsx scripts/release-version.ts output >> "$GITHUB_OUTPUT"
      - name: Validate development target
        run: |
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$SUPABASE_PRODUCTION_PROJECT_ID"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          test "$SUPABASE_PROJECT_ID" != "$SUPABASE_PRODUCTION_PROJECT_ID"
          test "$SUPABASE_URL" = "https://${SUPABASE_PROJECT_ID}.supabase.co"
      - name: Verify Supabase project identity
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase projects list --output json |
            jq -e --arg ref "$SUPABASE_PROJECT_ID" \
              '.[] | select(.id == $ref and .name == "pingpong-busu-dev")'
      - name: Prepare Edge Function shared modules
        run: pnpm edge:sync
      - name: Link development project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Preview development migrations and seed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked --dry-run --include-seed
      - name: Apply development migrations and seed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --linked --include-seed
      - name: Disable live crawlers in development
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          supabase secrets set
          --project-ref "$SUPABASE_PROJECT_ID"
          CRAWL_LIVE="false"
          CRAWLER_SOURCE_ASTREE_ENABLED="false"
          CRAWLER_SOURCE_TTADIVISION_ENABLED="false"
          CRAWLER_SOURCE_AIRPING_ENABLED="false"
          CRAWLER_SOURCE_OKPINGPONG_ENABLED="false"
          CRAWLER_SOURCE_MYTT_ENABLED="false"
          CRAWLER_SOURCE_SUPERSTAR_ENABLED="false"
          CRAWLER_SOURCE_YONGINTT_ENABLED="false"
          CRAWLER_SOURCE_IPING_ENABLED="false"
          CRAWLER_USER_AGENT="BUSU/${{ steps.version.outputs.version }}-development"
          CRAWLER_SOURCE_MIN_INTERVAL_MS="5000"
      - name: Deploy development Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
      - name: Verify development source safety
        run: |
          response="$(curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/sources?select=code,enabled&order=code.asc")"
          jq -e '
            length > 0 and
            any(.[]; .code == "mock" and .enabled == true) and
            all(.[]; .code == "mock" or .enabled == false)
          ' <<< "$response"
