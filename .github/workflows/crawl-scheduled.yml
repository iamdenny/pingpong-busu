name: Scheduled iPing refresh worker

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "7 * * * *"
  workflow_run:
    workflows: [Deploy Supabase backend]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: Worker operation
        required: true
        default: drain-iping
        type: choice
        options:
          - drain-iping
          - recover-iping

permissions:
  contents: read

concurrency:
  group: iping-refresh-worker
  cancel-in-progress: false

jobs:
  branch-guard:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = "refs/heads/main"

  drain:
    needs: branch-guard
    if: needs.branch-guard.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, iping]
    timeout-minutes: 8
    environment: production
    env:
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      REFRESH_WORKER_TOKEN: ${{ secrets.REFRESH_WORKER_TOKEN }}
      IPING_USERNAME: ${{ secrets.IPING_USERNAME }}
      IPING_PASSWORD: ${{ secrets.IPING_PASSWORD }}
      IPING_BROWSER_EXECUTABLE: /usr/bin/chromium
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate worker configuration
        run: |
          test -n "$SUPABASE_PROJECT_ID"
          test -n "$IPING_USERNAME"
          test -n "$IPING_PASSWORD"
          test "${#REFRESH_WORKER_TOKEN}" -eq 64
          case "$REFRESH_WORKER_TOKEN" in
            *[!0-9a-fA-F]*) exit 1 ;;
          esac
          test "$RUNNER_OS" = "Linux"
          test -x "$IPING_BROWSER_EXECUTABLE"
      - name: Drain one scheduled iPing refresh job
        if: github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *'
        run: pnpm iping:worker --mode drain-iping
      - name: Recover iPing protection once an hour
        if: github.event_name == 'schedule' && github.event.schedule == '7 * * * *'
        run: pnpm iping:worker --mode recover-iping
      - name: Drain one manually requested iPing refresh job
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'drain-iping'
        run: pnpm iping:worker --mode drain-iping
      - name: Recover and verify one iPing refresh job
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'recover-iping'
        run: pnpm iping:worker --mode recover-iping
      - name: Recover iPing after a successful backend deployment
        if: github.event_name == 'workflow_run'
        run: pnpm iping:worker --mode recover-iping
